[package]
name = "tile-ripper"
version = "0.1.0-alpha.1"
edition = "2021"
publish = false
description = "Inspectable native acquisition for narrow STAC/COG and scientific Zarr profiles"

[features]
default = ["gdal"]
gdal = ["dep:gdal"]
native-cog = ["dep:tiff-reader", "dep:geotiff-core", "dep:roxmltree", "dep:geo", "dep:proj4rs"]
experimental-output = ["zarrs/sharding"]

[dependencies]
gdal = { version = "=0.19.0", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
stac = { version = "=0.17.6", features = ["std"] }
stac-io = "=0.3.4"
tokio = { version = "=1.48.0", features = ["rt"] }
zarrs = { version = "=0.22.10", default-features = false, features = ["filesystem", "gzip", "blosc"] }
# Scoped copy of the existing filesystem dependency; see its patch note.
zarrs_filesystem = { version = "=0.3.13", path = "vendor/zarrs_filesystem" }

reqwest = { version = "=0.13.5", features = ["blocking"] }
flate2 = "=1.1.10"
ctrlc = { version = "=3.5.2", features = ["termination"] }

tiff-reader = { version = "=0.9.0", default-features = false, optional = true }
geotiff-core = { version = "=0.9.0", optional = true }
roxmltree = { version = "=0.21.1", optional = true }
geo = { version = "=0.33.1", default-features = false, optional = true }
proj4rs = { version = "=0.2.1", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
