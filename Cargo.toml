[package]
name = "tile-ripper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gdal = "=0.19.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
stac = { version = "=0.17.6", features = ["std"] }
stac-io = "=0.3.4"
tokio = { version = "=1.48.0", features = ["rt"] }
