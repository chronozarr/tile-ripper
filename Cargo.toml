[package]
name = "tile-ripper"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.91"
publish = false
license = "Apache-2.0"
description = "Inspectable native acquisition for narrow STAC/COG and scientific Zarr profiles"

[features]
default = ["gdal"]
gdal = ["dep:gdal"]
native-cog = ["dep:tiff-reader", "dep:geotiff-core", "dep:roxmltree", "dep:geo", "dep:proj4rs"]
native-hdf5 = ["dep:roxmltree", "dep:hdf5-reader", "dep:geo", "dep:proj4rs", "dep:ring"]
authenticated-http = ["reqwest/cookies", "tokio/rt-multi-thread", "tokio/time", "tokio/macros", "dep:ring"]
experimental-output = ["zarrs/sharding", "zarrs/zstd"]

[dependencies]
hdf5-reader = { version = "=0.9.3", path = "vendor/hdf5-reader", default-features = false, optional = true }
gdal = { version = "=0.19.0", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
stac = { version = "=0.17.6", features = ["std"] }
stac-io = "=0.3.4"
tokio = { version = "=1.48.0", features = ["rt"] }
zarrs = { version = "=0.23.14", default-features = false, features = ["filesystem", "gzip", "blosc", "crc32c", "sharding", "zstd"] }
# Scoped copy of the existing filesystem dependency; see its patch note.
zarrs_filesystem = { version = "=0.3.13", path = "vendor/zarrs_filesystem" }

reqwest = { version = "=0.13.5", features = ["blocking"] }
flate2 = "=1.1.10"
zstd = "=0.13.3"
base64 = "=0.22.1"
ctrlc = { version = "=3.5.2", features = ["termination"] }
ring = { version = "=0.17.14", optional = true }

tiff-reader = { version = "=0.9.0", default-features = false, optional = true }
geotiff-core = { version = "=0.9.0", optional = true }
roxmltree = { version = "=0.21.1", optional = true }
geo = { version = "=0.33.1", default-features = false, optional = true }
proj4rs = { version = "=0.2.1", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
