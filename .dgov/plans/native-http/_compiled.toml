Verify:
cargo test --locked --no-default-features --features native-cog
"""
commit_message = ""
depends_on = ["tasks/work.baseline"]
timeout_s = 0
test_cmd = "cargo test --locked --no-default-features --features native-cog"
files.touch = ["src/storage.rs"]
files.create = ["tests/native_http_snapshot.rs"]
files.edit = ["src/native_cog.rs", "src/cog_range.rs", "src/cog.rs", "src/scheduler.rs", "src/planner.rs", "src/acquisition.rs", "src/stac_workflow.rs", "src/execute.rs"]

[tasks."tasks/work.usability"]
