[plan]
name = "acquisition-planner-proof"
source_mtime_max = "2026-10-19T00:59:32.415605Z"
sop_set_hash = ""

[tasks."tasks/prototype.prototype"]
summary = "Implement the bounded acquisition planning proof"
prompt = """
Orient:
Read docs/0001-acquisition-planner.md and the preserved study.
Edit:
Implement one Rust library and thin CLI for native COG extraction with
GDAL, plus a planning-only Zarr chunk-object adapter. Preserve study inputs.
Verify:
cargo test --locked; cargo clippy --locked --all-targets -- -D warnings
"""
commit_message = "Prototype format-extensible acquisition planning"
timeout_s = 0
test_cmd = "cargo test --locked"
files.create = ["Cargo.toml", "Cargo.lock", "src/model.rs", "src/lib.rs", "src/planner.rs", "src/cog.rs", "src/zarr.rs", "src/execute.rs", "src/main.rs", "tests/planner.rs"]
files.read = ["docs/0001-acquisition-planner.md"]

[tasks."tasks/validation.validation"]
summary = "Check SQL parity, independent pixels and report the decision gate"
prompt = """
Orient:
Read study/experiments and docs/0001-acquisition-planner.md.
Edit:
Add an offline SQL parity comparison and an interleaved local benchmark
with exact HTTP accounting and an independent GDAL oracle. Report limits.
Verify:
Run bench/compare_study.py and bench/run.py in the original locked
study Python environment, and record results under docs/. No public stress tests.
"""
commit_message = "Validate acquisition planner and record decision gate"
depends_on = ["tasks/prototype.prototype"]
timeout_s = 0
test_cmd = "cargo test --locked"
files.create = ["bench/make_fixture.py", "bench/gdal_worker.py", "bench/run.py", "bench/compare_study.py", "examples/layout_oracle.rs", "README.md", "docs/decision-gate.md"]
files.read = ["docs/0001-acquisition-planner.md"]
