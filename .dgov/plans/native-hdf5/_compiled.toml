5. Commit validated work locally. No merge, tag, publish, deploy, ChronoZarr change, persistent cache or whole-object fallback.
Verify:
- CARGO_INCREMENTAL=0 cargo test --no-default-features --features native-hdf5
- Run the hdf5 harness and existing COG/Zarr/streaming/durable-output regressions with the required feature matrix.
"""
