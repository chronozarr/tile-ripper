summary = "Unify lifecycle and evaluate physical read selection"
prompt = """
Orient:
Read architecture, COG/STAC and Zarr workflows and decision/benchmark evidence.
Edit:
Use the existing Request and physical adapters. Add one prepared lifecycle,
inspection/result schemas, native directory CLI and compatibility aliases.
Read Zarr native chunks once and fan out bounded buffers without caching.
Verify:
Shared lifecycle tests, GDAL/xarray oracles, physical key minimum comparisons,
small/medium benchmarks against 46dd503 and established readers. No new format,
remote Zarr, generalized engine, publication or merge. Stop at decision gate.
"""
