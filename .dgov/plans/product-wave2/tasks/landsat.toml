[tasks.landsat]
summary = "Historical Landsat independent source qualification"
role = "worker"
files = { touch = ["bench/wave2_landsat.py", "docs/products/wave2/landsat*"] }
prompt = """
Orient:
- Read the supplied Wave 2 brief and current qualification docs.
Edit:
- Historical Landsat independent source qualification. Preserve source/version, native values, masks, quality semantics, and bounded acquisition. No push/merge/deploy.
Verify:
- cargo test --locked --no-default-features --features native-cog,native-hdf5,authenticated-http; independent mature-reader real-source comparison.
"""
commit_message = "Qualify Wave 2 landsat"
test_cmd = "cargo test --locked --no-default-features --features native-cog,native-hdf5,authenticated-http"
