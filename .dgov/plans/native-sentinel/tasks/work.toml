[tasks.spatial]
summary = "Pure Rust WGS84 to Sentinel UTM selection and pixel-center masks"
role = "worker"
prompt = """
Orient:
Read spatial.rs, spatial_gdal.rs and planner.rs.
Edit:
Implement bounded validated WGS84/UTM polygon operations using established Rust crates; preserve GDAL compatibility/default.
Verify:
cargo test --locked --no-default-features --features native-cog
"""
files = { create = ["src/spatial_native.rs"], edit = ["src/spatial.rs", "Cargo.toml", "Cargo.lock", "consumers/native-stats/Cargo.lock"] }
test_cmd = "cargo test --locked --no-default-features --features native-cog"

[tasks.workflow]
summary = "Decouple STAC discovery and incremental consumer from GDAL"
role = "worker"
depends_on = ["spatial"]
prompt = """
Orient:
Read STAC, acquisition and stream completion paths.
Edit:
Reuse STAC selection and planner without GDAL; wire native masks; document standalone stream consumer and completion.
Verify:
cargo clippy --locked --no-default-features --features native-cog --all-targets -- -D warnings
"""
files = { edit = ["src/stac_workflow.rs", "src/acquisition.rs", "src/spatial_gdal.rs", "src/native_cog.rs", "consumers/native-stats/src/main.rs", "consumers/native-stats/README.md", "README.md"], create = ["docs/native-sentinel/workflow.md", "docs/native-sentinel/protocol.md", "bench/native_sentinel_live.py", "bench/native_sentinel_linux.sh", "bench/native_sentinel_runtime.py"] }
test_cmd = "cargo clippy --locked --no-default-features --features native-cog --all-targets -- -D warnings"

[tasks.oracle]
summary = "Independently compute GDAL reference values, transforms and boundary masks"
role = "worker"
depends_on = ["workflow"]
prompt = """
Orient:
Read existing native COG independent oracle and planner chunk selection.
Edit:
Build adversarial geometry corpus and exact sample comparison using independent GDAL outputs.
Verify:
prototype-output/zarr-env/bin/python bench/native_sentinel_checks.py
"""
files = { create = ["bench/native_sentinel_checks.py", "examples/native_sentinel_oracle.rs", "docs/native-sentinel/correctness.json"] }
test_cmd = "prototype-output/zarr-env/bin/python bench/native_sentinel_checks.py"

[tasks.requests]
summary = "Explain native request overhead and gate any range optimization on traces"
role = "worker"
prompt = """
Orient:
Read frozen native COG physical byte/request traces.
Edit:
Profile metadata versus tile requests, adjacency, connection reuse, decoding and scheduling. Coalesce only with demonstrated benefit and preserved bounds/version accounting.
Verify:
prototype-output/zarr-env/bin/python bench/native_request_profile.py
"""
files = { touch = ["src/cog_range.rs"], create = ["bench/native_request_profile.py", "docs/native-sentinel/request-profile.json", "docs/native-sentinel/request-profile.md"] }
test_cmd = "prototype-output/zarr-env/bin/python bench/native_request_profile.py"
