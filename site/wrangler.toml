name = "tile-ripper-docs"
compatibility_date = "2026-09-01"
main = "worker.js"
workers_dev = true
routes = [
  { pattern = "tileripper.com", custom_domain = true },
  { pattern = "www.tileripper.com", custom_domain = true },
]
[assets]
run_worker_first = true
binding = "ASSETS"
directory = "./docs/dist"
not_found_handling = "404-page"
