[package]
name = "zarr-v3-repro"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: no tile-ripper dependency, filesystem adapter or source imagery.
[workspace]

[features]
native-backend = ["flate2/zlib-rs"]
upstream-fixed = []

[dependencies]
zarrs = { version = "=0.22.10", default-features = false, features = ["gzip", "sharding"] }
flate2 = "=1.1.10"
serde_json = "=1.0.145"
